name: ② Android Release（内测版）

# 打 tag 触发，如 v1.0.0
# 用于：蒲公英内测、应用市场上架审核
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore release-keystore.jks \
            -alias release-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass releasepass123 -keypass releasepass123 \
            -dname "CN=mumujizhang, OU=Dev, O=mumujizhang, L=Beijing, ST=Beijing, C=CN"

          cat > android/key.properties << 'EOF'
          storePassword=releasepass123
          keyPassword=releasepass123
          keyAlias=release-key
          storeFile=release-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload to 蒲公英（自动）
        run: |
          curl -F "file=@build/app/outputs/flutter-apk/app-release.apk" \
               -F "_api_key=${{ secrets.PGYER_API_KEY }}" \
               -F "buildUpdateDescription=正式版 ${{ github.ref_name }} 构建 $(date '+%Y-%m-%d')" \
               -F "buildVersion=${{ github.ref_name }}" \
               https://www.pgyer.com/apiv2/app/upload

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: mumujizhang ${{ github.ref_name }}
          body: |
            ## mumujizhang ${{ github.ref_name }}

            **下载 APK 安装测试**

            构建时间：$(date '+%Y-%m-%d %H:%M')
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
