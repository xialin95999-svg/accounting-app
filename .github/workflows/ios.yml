name: iOS Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Create iOS project
        # accounting-app 含连字符，flutter create . 会失败
        # 先改名再创建，创建完再改回来
        run: |
          mv accounting-app accounting_app_tmp
          flutter create --platforms=ios --org com.example --project-name accounting_app accounting_app_tmp
          mv accounting_app_tmp accounting-app
          ls ios/

      - name: Build iOS (simulator)
        run: flutter build ios --simulator --no-codesign

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphonesimulator/
          retention-days: 7
